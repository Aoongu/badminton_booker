name: Deploy to Alibaba Cloud Function Compute

on:
  push:
    branches:
      - fullstack

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install serverless devs
        run: npm install -g @serverless-devs/s
        
      - name: Deploy to Alibaba Cloud
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          s config add default --AccessKeyID $ALIBABA_CLOUD_ACCESS_KEY_ID --AccessKeySecret $ALIBABA_CLOUD_ACCESS_KEY_SECRET -a default
          DATABASE_URL=$DATABASE_URL s deploy --access default
