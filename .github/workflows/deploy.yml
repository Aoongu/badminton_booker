name: Deploy to Alibaba Cloud Function Compute

on:
  push:
    branches:
      - fullstack

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install serverless devs
        run: npm install -g @serverless-devs/s
        
      - name: Configure credentials
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          mkdir -p ~/.s
          cat > ~/.s/credentials << 'EOF'
          default:
            Alias: default
            AccessKeyID: ${ALIBABA_CLOUD_ACCESS_KEY_ID}
            AccessKeySecret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
          EOF
          
      - name: Deploy to Alibaba Cloud
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATABASE_URL=$DATABASE_URL s deploy --access default
